server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 565m;
  location /api/ {
    # OAuth query parameters must never be written to request logs.
    access_log off;
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Codex's native browser OAuth callback. Only loopback is published by Compose.
server {
  listen 1455;
  server_name 127.0.0.1 localhost;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  location = /auth/callback {
    proxy_pass http://api:8090/api/providers/codex/callback;
    proxy_set_header Host 127.0.0.1;
    proxy_read_timeout 80s;
  }
  location / { return 404; }
}
