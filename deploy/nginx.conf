limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=15r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 565m;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  location ~ ^/api/auth/(register|login|forgot-password|resend-verification|reset-password)$ {
    limit_req zone=auth_requests burst=40 nodelay;
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://api:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }
  location = /api/jobs {
    limit_req zone=api_requests burst=40 nodelay;
    access_log off;
    client_max_body_size 565m;
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
  location ~ ^/api/notes/[^/]+/assets$ {
    limit_req zone=api_requests burst=40 nodelay;
    access_log off;
    client_max_body_size 11m;
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
  location /api/ {
    limit_req zone=api_requests burst=40 nodelay;
    client_max_body_size 6m;
    # OAuth query parameters must never be written to request logs.
    access_log off;
    proxy_pass http://api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
